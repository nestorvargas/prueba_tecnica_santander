services:
  postgres:
    image: postgres:16-alpine
    container_name: base-postgres
    environment:
      POSTGRES_DB: base
      POSTGRES_USER: base
      POSTGRES_PASSWORD: base
    ports:
      - "5436:5432"
    volumes:
      - base-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U base -d base"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  base-data:
