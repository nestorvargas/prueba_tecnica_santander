spring:
  application:
    name: base-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/base}
    username: ${DB_USER:base}
    password: ${DB_PASSWORD:base}
  jpa:
    hibernate:
      # El esquema lo crea Flyway; Hibernate solo verifica que las entidades coincidan con las tablas
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: 8080
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  seguridad:
    # Secreto HS256: mínimo 32 caracteres. En cualquier entorno real se define con JWT_SECRET
    jwt-secreto: ${JWT_SECRET:clave-de-desarrollo-cambiar-en-produccion-1234567890}
    jwt-expiracion: ${JWT_EXPIRACION:1h}
    usuario: ${APP_USUARIO:admin}
    clave: ${APP_CLAVE:admin123}
